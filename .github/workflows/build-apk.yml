name: Build DocSathi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir buildsrc
          unzip -q DocSathi-Android-v1-Source.zip -d buildsrc

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find buildsrc -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)
          echo "APK=$APK" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocSathi-APK
          path: ${{ env.APK }}
